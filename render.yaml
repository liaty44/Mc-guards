services:
  - type: web
    name: guardian-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MC_HOST
        sync: false
      - key: MC_PORT
        value: "25565"
      - key: MC_VERSION
        value: auto
      - key: OWNER_NAME
        sync: false
      - key: GUARD_1_NAME
        sync: false
      - key: GUARD_2_NAME
        sync: false
      - key: AUTH_MODE
        value: offline
